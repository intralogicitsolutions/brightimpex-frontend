<div class="relative">
  <!-- Navigation Bar -->
  <div class="h-20 lg:h-28 bg-white flex lg:justify-between nav-bar relative z-50">
      <div class="pl-2 lg:w-60 lg:pl-6 pr-2 flex items-center mobile-icons-hide">
        <img src="assets/icons/facebook-2.svg" class="w-6 mx-2 cursor-pointer" (click)="moveToSocial('fb')">
        <img src="assets/icons/youtube-2.svg"class="w-6 mx-2 cursor-pointer" (click)="moveToSocial('yt')">
       <img src="assets/icons/instagram-2.svg"class="w-6 mx-2 cursor-pointer" (click)="moveToSocial('ig')">
        <img src="assets/icons/linkedin-2.svg"class="w-6 mx-2 cursor-pointer" (click)="moveToSocial('li')">
        <a href="mailto:connect@brightimpex.com" class="w-6 mx-2"><img src="assets/icons/mail-2.svg"></a>
          <!-- <img src="assets/images/Bright-Impex-Logo-Full-1.png" alt="" class="h-full w-auto cursor-pointer"
              routerLink="/home"> -->
      </div>
      <div class="navigation-menu flex-col space-y-2">
        <div>
          <img src="assets/images/Bright-Impex-Logo-Full-1.png" alt="" class="h-16 w-auto cursor-pointer"
              routerLink="/home">
        </div>
        <div class="navigation-menu">
            <a class="mx-3 cursor-pointer link-underline" routerLink="/home" routerLinkActive="active-link">Home</a>
            <a class="mx-3 cursor-pointer link-underline" routerLink="/catalogue"
                routerLinkActive="active-link">Products</a>
            <a class="mx-3 cursor-pointer link-underline" routerLink="/about-us" routerLinkActive="active-link">
                About Bright Impex
            </a>
            <a class="mx-3 cursor-pointer link-underline" routerLink="/contact-us" routerLinkActive="active-link">
                Inquiry Now
            </a>
        </div>
      </div>
      <div class="w-full relative lg:w-60 flex lg:justify-end items-center">
          <div class="lg:pr-8 pr-6 mobile-icons-hide">
              <img src="assets/icons/call.svg" alt="" class="cursor-pointer">
          </div>
          @if (isMenuOpen) {
          <div class="menu-icon px-4 flex text-primary">
              <mat-icon (click)="toggleMenu()">close</mat-icon>
          </div>
          } @else {
          <div class="menu-icon px-4">
              <img src="assets/icons/textalign-left.svg" alt="" class="cursor-pointer menu-icon-height" (click)="toggleMenu()">
          </div>
          }
          <div class="flex absolute w-screen justify-center items-center -z-10">
            <img src="assets/images/Bright-Impex-Logo-Full-1.png" alt="" class="h-16 cursor-pointer mobile-logo-hide"
              routerLink="/home">
          </div>

      </div>
  </div>

  <!-- Background Blur Overlay -->
  <div class="fixed inset-0 transition-opacity duration-300 ease-in-out z-10"
      [ngClass]="{'opacity-100 visible': isMenuOpen, 'opacity-0 invisible': !isMenuOpen}" (click)="toggleMenu()"
      style="background: #0000005C;">
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu fixed left-0 top-20 w-full bg-white shadow-lg border-t-primary
  transition-all duration-300 ease-in-out transform origin-top z-50 overflow-hidden"
      [ngClass]="{'scale-y-100 opacity-100 max-h-screen': isMenuOpen, 'scale-y-0 opacity-0 max-h-0': !isMenuOpen}">
      <ul class="space-y-2 p-4 h-full flex flex-col justify-between">
          <li>
              <a class="mx-3 cursor-pointer link-underline" routerLink="/home" routerLinkActive="active-link">Home</a>
          </li>
          <li>
              <a class="mx-3 cursor-pointer link-underline" routerLink="/catalogue" routerLinkActive="active-link">
                  Products
              </a>
          </li>
          <li>
              <a class="mx-3 cursor-pointer link-underline" routerLink="/about-us" routerLinkActive="active-link">
                  About Bright Impex
              </a>
          </li>
          <li>
              <a class="mx-3 cursor-pointer link-underline" routerLink="/contact-us" routerLinkActive="active-link">
                  Contact Us
              </a>
          </li>
      </ul>
  </div>
</div>
